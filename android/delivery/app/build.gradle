plugins {
    id 'com.android.application'
}

android {
    namespace 'online.warungjnj.delivery'
    compileSdk 34

    defaultConfig {
        applicationId "online.warungjnj.delivery"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        manifestPlaceholders = [
            hostName: "warungjnj.online",
            defaultUrl: "https://warungjnj.online/delivery",
            launcherName: "Warung J&J Delivery",
            themeColor: "#ea580c",
            navigationColor: "#1c1917"
        ]
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
